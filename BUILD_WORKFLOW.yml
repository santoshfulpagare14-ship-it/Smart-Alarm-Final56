
name: Build Native APK (Flat Files)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct Folder Structure
        run: |
          echo "Reconstructing..."
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/example/smartalarm
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p .github/workflows

          mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties || true
          mv app_build.gradle app/build.gradle || true
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          mv themes.xml app/src/main/res/values/themes.xml || true
          mv activity_main.xml app/src/main/res/layout/activity_main.xml || true
          mv activity_alarm_ring.xml app/src/main/res/layout/activity_alarm_ring.xml || true
          mv MainActivity.java app/src/main/java/com/example/smartalarm/MainActivity.java || true
          mv AlarmReceiver.java app/src/main/java/com/example/smartalarm/AlarmReceiver.java || true
          mv AlarmService.java app/src/main/java/com/example/smartalarm/AlarmService.java || true
          mv AlarmRingActivity.java app/src/main/java/com/example/smartalarm/AlarmRingActivity.java || true
          mv BootReceiver.java app/src/main/java/com/example/smartalarm/BootReceiver.java || true
          
          # Keep workflow file itself
          cp .github/workflows/build-apk.yml .github/workflows/build-apk.yml 2>/dev/null || true
          
          ls -R

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlarm-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
